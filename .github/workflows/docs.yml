name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: repo
      - name: Check out wiki
        id: wiki
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Explain missing wiki
        if: steps.wiki.outcome == 'failure'
        run: |
          echo "::error::The wiki repository does not exist. Enable Wikis in Settings > General > Features and create a Home page once (see docs/PLAN.md, Manual setup)."
          exit 1
      - name: Sync docs to wiki
        run: |
          rsync -a --delete --exclude .git repo/docs/ wiki/
          # Wiki links have no .md suffix.
          find wiki -name '*.md' -exec sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' {} +
      - name: Commit and push
        working-directory: wiki
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync docs from ${GITHUB_SHA::7}"
          git push
