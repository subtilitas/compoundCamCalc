<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Design the string and cable tracks of a twin-cam compound bow from a target draw force curve. Export DXF and STEP." />
    <title>Compound Cam Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='11' fill='none' stroke='%23206a5d' stroke-width='3'/%3E%3Ccircle cx='17' cy='16' r='3' fill='%23206a5d'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="app-header">
      <h1>Compound Cam Calculator</h1>
      <p class="tagline">Twin-cam track design from a target draw force curve</p>
    </header>
    <main id="app" class="app-main" data-solve-state="idle">
      <section class="panel" aria-labelledby="status-title">
        <h2 id="status-title">Status</h2>
        <p>The calculator is under construction. The force curve editor, the cam solver and the DXF and STEP exports follow in later releases.</p>
      </section>
    </main>
    <footer class="app-footer">
      <span>Static model: string stretch, cam timing and dynamics are not modelled.</span>
      <span id="app-version"></span>
    </footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
